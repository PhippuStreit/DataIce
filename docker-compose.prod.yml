services:
  db:
    image: postgres:16-alpine
    container_name: dataice-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      POSTGRES_DB: dataice
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataice"]
      timeout: 5s
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - dataice-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataice-web
    command: sh -c "npx prisma db push --skip-generate && npm start -- --hostname 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/dataice?schema=public
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.prod}
      ANALYTICS_USER: ${ANALYTICS_USER:-nexplore}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    networks:
      - dataice-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dataice-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
